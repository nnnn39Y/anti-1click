<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>anti-1click</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>anti-1click</h1>

  </main>
  <script src="popup.js"></script>
</body>
</html>
